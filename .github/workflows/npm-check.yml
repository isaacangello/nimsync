name: npm check

# Diagnóstico temporário: confirma com qual conta o NPM_TOKEN publica
# e se o nome do pacote é aceito pelo registry.
on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  check:
    name: Inspect npm identity and package name
    runs-on: ubuntu-latest
    steps:
      - name: Setup Node.js and npm registry
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Who am I
        run: npm whoami
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Package manifest
        run: node -p "const p=require('./package.json'); console.log(p.name, p.version)"

      - name: Can this name be published?
        run: npm publish --dry-run --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
