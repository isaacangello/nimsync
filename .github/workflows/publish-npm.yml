name: Publish npm

on:
  push:
    tags:
      - "v*.*.*"
  # publicação manual (ex.: quando o tag já existe e só o nome do pacote mudou)
  workflow_dispatch:
    inputs:
      version:
        description: "Versão a publicar (ex: 0.5.0)"
        required: true
        type: string

permissions:
  contents: read
  id-token: write # npm provenance

concurrency:
  group: publish-npm-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Validate and publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node.js and npm registry
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Validate stats command
        run: |
          bash -n scripts/nimsync-stats.sh
          scripts/nimsync-stats.sh --help > /dev/null
          test -x scripts/nimsync-stats.sh

      - name: Check tag and package version
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "${EVENT_NAME}" = "workflow_dispatch" ]; then
            TAG_VERSION="${INPUT_VERSION}"
          else
            TAG_VERSION="${GITHUB_REF_NAME#v}"
          fi
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          echo "Tag: ${TAG_VERSION}; package: ${PACKAGE_VERSION}"
          test "${TAG_VERSION}" = "${PACKAGE_VERSION}"

      - name: Inspect package
        run: npm pack --dry-run

      - name: Check if this version is already on the registry
        id: registry
        run: |
          NAME="$(node -p "require('./package.json').name")"
          VERSION="$(node -p "require('./package.json').version")"
          if npm view "${NAME}@${VERSION}" version > /dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "${NAME}@${VERSION} já está publicado — nada a fazer"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify publish manifest
        if: steps.registry.outputs.published != 'true'
        run: npm publish --dry-run --access public

      - name: Publish to npm
        if: steps.registry.outputs.published != 'true'
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
